<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- `viewport-fit=cover` lets the board reach into the notch; the layout
         pays it back with env(safe-area-inset-*) padding. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e3138" />
    <meta name="description" content="Play Monopoly Deal with friends around one table, with voice and video." />
    <!-- iOS reads none of the manifest: standalone mode, the status bar and
         the home-screen name are all still its own meta tags. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `black-translucent` lays the page UNDER the status bar, so the header
         ends up beneath the Dynamic Island. `default` makes iOS reserve that
         strip; the safe-area padding below is the belt to this braces. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Deal" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Monopoly Deal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
